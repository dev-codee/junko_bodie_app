workflows:
  ios-testflight:
    name: iOS TestFlight Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: new key
    environment:
      flutter: stable
      xcode: latest
      groups:
        - junko
      vars:
        APP_STORE_APPLE_ID: 6787383059
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.junkobodieroulette.app
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-number=$((LATEST + 1))
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true